name: Build Titan Gym Android Release AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build & Sign Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Bundle
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          # Accept licenses and install required build tools
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Android App Bundle (.aab)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload Production AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: titan-gym-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
